name: Build App APK (native)

# Builds the self-contained native Android app (Capacitor) — all the app's
# screens are bundled inside the APK; it talks to the API only for the shared
# data. Produces a signed APK uploaded as an artifact.
#
# Run from the Actions tab -> "Build App APK (native)" -> Run workflow, then
# download the "music-directory-app-apk" artifact when it's green.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp app version (for in-app updates)
        run: sed -i "s/__APP_VERSION__/${GITHUB_SHA:0:12}/" app/www/js/app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Generate icons and splash
        working-directory: app
        run: npx capacitor-assets generate --android || npx @capacitor/assets generate --android

      - name: Sync web assets
        working-directory: app
        run: npx cap sync android

      - name: Raise compile/target SDK to 35 (required by plugin dependencies)
        working-directory: app/android
        run: |
          set -e
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/; s/targetSdkVersion = 34/targetSdkVersion = 35/' variables.gradle
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          echo "--- variables.gradle ---"; grep -E 'compileSdkVersion|targetSdkVersion' variables.gradle

      - name: Build and sign the APK
        working-directory: app/android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          UNSIGNED=$(find . -path '*release*' -name '*.apk' | head -1)
          echo "unsigned APK: $UNSIGNED"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -v -p 4 "$UNSIGNED" app-aligned.apk
          "$BT/apksigner" sign --ks "$GITHUB_WORKSPACE/apk/android.keystore" --ks-key-alias muzik \
            --ks-pass pass:muzikdirektorie2026 --key-pass pass:muzikdirektorie2026 \
            --out music-directory-app.apk app-aligned.apk
          "$BT/apksigner" verify --verbose music-directory-app.apk
          ls -la music-directory-app.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: music-directory-app-apk
          path: app/android/music-directory-app.apk
          if-no-files-found: error
